
# https://www.home-assistant.io/installation/raspberrypi-other
name: hl_homeassistant

services: 
  home-assistant: 
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: home-assistant 
    restart: unless-stopped
    environment:
      TZ: Europe/Bucharest
    network_mode: host
    volumes:
      - ./config:/config
      - /run/dbus:/run/dbus:ro

  matter-server: # For Smart+ Matter devices 
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-data:/data
      - /run/dbus:/run/dbus:ro
    network_mode: host

